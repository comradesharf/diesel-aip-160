[package]
name = "diesel-aip-160"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
description = "Parse AIP-160 filters and compile typed, parameterized Diesel predicates"
categories = ["database", "parser-implementations"]
readme = "README.md"
documentation = "https://docs.rs/diesel-aip-160"
publish = true

[package.metadata.docs.rs]
features = ["postgres"]

[dependencies]
anyhow.workspace = true
diesel = { workspace = true, optional = true, default-features = false }
serde_json = "1"
diesel-aip-160-derive = { path = "../diesel-aip-160-derive", version = "0.1.0-beta.1" }

[features]
default = []
sqlite = ["dep:diesel", "diesel/sqlite"]
mysql = ["dep:diesel", "diesel/mysql_backend"]
postgres = ["dep:diesel", "diesel/postgres_backend", "diesel/serde_json"]

[[test]]
name = "derive"
required-features = ["postgres"]

[[example]]
name = "sqlite"
required-features = ["sqlite"]

[[example]]
name = "mysql"
required-features = ["mysql"]

[[example]]
name = "postgres"
required-features = ["postgres"]
