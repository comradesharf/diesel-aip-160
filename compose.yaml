services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: aip160
      POSTGRES_USER: aip160
      POSTGRES_PASSWORD: aip160
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mysql:
    image: mysql:26.7.0
    environment:
      MYSQL_DATABASE: aip160
      MYSQL_USER: aip160
      MYSQL_PASSWORD: aip160
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
  mysql_data:
